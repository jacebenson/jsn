name: Publish production package

on:
  push:
    tags: ['v*.*.*']

# One-time npm setup:
# Package settings -> Trusted Publishers -> GitHub Actions.
# Repository: jacebenson/jsn. Workflow: publish-prod.yml.
permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish production package
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # npm trusted publishing needs npm 11.5.1 or newer for OIDC.
      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Verify tag matches package version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version="${TAG_VERSION#v}"
          test "$tag_version" = "$package_version" || {
            echo "Tag $TAG_VERSION does not match package.json version $package_version"
            exit 1
          }

      - name: Publish production package
        run: npm publish --access public --provenance --tag latest
