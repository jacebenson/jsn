name: Release production

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump to apply
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  actions: write
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag, and release production package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # npm only commits and tags when it runs from the repository root, and this
      # job works inside cli/. Bump the package without touching git, then read
      # the tag from the package itself instead of git describe, which returns an
      # unrelated docs-index tag when one points at HEAD.
      - name: Bump package version
        id: version
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          npm --prefix cli version "$RELEASE_TYPE" --no-git-tag-version
          version=$(node -p "require('./cli/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Commit release commit and tag
        working-directory: ${{ github.workspace }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add cli/package.json cli/package-lock.json
          git commit -m "chore: release $TAG"
          git tag "$TAG"

      - name: Push release commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push origin HEAD:main "$TAG"

      - name: Dispatch production npm publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run publish-prod.yml --ref main -f tag="$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
