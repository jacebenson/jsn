name: CI

on:
  push:
    branches: [main]
  # No base-branch filter. Stacked PRs and PRs opened against a merge target
  # other than main were skipping every check, so unverified branches could be
  # merged. The target job below fails a PR aimed at `dev`, which is regenerated
  # from main by promote-main-to-dev and discards anything merged into it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Only obsolete PR validation may be cancelled. Main runs remain independent.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  target:
    name: Merge target
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Reject a PR that targets the generated dev branch
        run: |
          echo "::error::dev is regenerated from main by promote-main-to-dev. Retarget this PR at main; a merge into dev is discarded on the next promotion."
          exit 1
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.changes.outputs.cli }}
      site: ${{ steps.changes.outputs.site }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/changed-components.mjs "$BASE_SHA" >> "$GITHUB_OUTPUT"

  docs:
    name: Documentation checks
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      # Builtins only: no npm ci, no build, no network. Remote links are counted
      # but never fetched, so an upstream outage cannot fail the job.
      - name: Check Markdown links, paths and packaged README
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/check-docs.mjs "$BASE_SHA"

  cli:
    name: CLI tests
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - name: Native Windows Credential Manager (production host discovery)
        if: runner.os == 'Windows'
        env:
          JSN_REQUIRE_WINDOWS_CREDENTIAL_TEST: '1'
          JSN_TEST_WINDOWS_POWERSHELL: default
        run: node --test test/windows-credential-native.test.js
      - name: Native Windows Credential Manager (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        env:
          JSN_REQUIRE_WINDOWS_CREDENTIAL_TEST: '1'
          JSN_TEST_WINDOWS_POWERSHELL: powershell.exe
        run: node --test test/windows-credential-native.test.js
      - name: Native Windows Credential Manager (PowerShell 7)
        if: runner.os == 'Windows'
        env:
          JSN_REQUIRE_WINDOWS_CREDENTIAL_TEST: '1'
          JSN_TEST_WINDOWS_POWERSHELL: pwsh.exe
        run: node --test test/windows-credential-native.test.js
      - run: npm test
      - run: npm run lint
      - name: Verify npm package contents
        run: npm pack --dry-run

  workflows:
    name: GitHub tooling tests
    needs: changes
    # The existing conservative classifier selects CLI for all non-prose
    # .github changes, including helpers and these tests. No second CLI suite.
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Offline integration exercises the immutable historical producer.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - run: npm --prefix cli ci --ignore-scripts
      - run: npm run test:workflows

  site:
    name: Website tests
    needs: changes
    if: needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/docs-site.yml

  test:
    name: Tests
    if: always()
    needs: [target, changes, cli, workflows, site, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks for affected applications
        env:
          TARGET: ${{ needs.target.result }}
          CHANGES: ${{ needs.changes.result }}
          CLI: ${{ needs.cli.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
          SITE: ${{ needs.site.result }}
          DOCS: ${{ needs.docs.result }}
        run: |
          test "$TARGET" = success || test "$TARGET" = skipped
          test "$CHANGES" = success
          test "$CLI" = success || test "$CLI" = skipped
          test "$WORKFLOWS" = success || test "$WORKFLOWS" = skipped
          test "$SITE" = success || test "$SITE" = skipped
          test "$DOCS" = success || test "$DOCS" = skipped
