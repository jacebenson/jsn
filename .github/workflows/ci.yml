name: CI

on:
  push:
    branches: [main]
  # No base-branch filter. Stacked PRs and PRs opened against a merge target
  # other than main were skipping every check, so unverified branches could be
  # merged. The target job below fails a PR aimed at `dev`, which is regenerated
  # from main by promote-main-to-dev and discards anything merged into it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  target:
    name: Merge target
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Reject a PR that targets the generated dev branch
        run: |
          echo "::error::dev is regenerated from main by promote-main-to-dev. Retarget this PR at main; a merge into dev is discarded on the next promotion."
          exit 1
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.changes.outputs.cli }}
      site: ${{ steps.changes.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/changed-components.mjs "$BASE_SHA" >> "$GITHUB_OUTPUT"

  cli:
    name: CLI tests
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Verify npm package contents
        run: npm pack --dry-run

  site:
    name: Website tests
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build website and shared documentation engine
        run: docker build -f site/Dockerfile -t jsn-site:test .
      - name: Verify website routes and documentation API
        run: docker run --rm --entrypoint bin/test -e SECRET_KEY_BASE=ci-test-only jsn-site:test
      - name: Verify shared sync and Markdown handling
        run: >-
          docker run --rm --entrypoint node jsn-site:test
          --test test/sync-docs.test.mjs test/markdown.test.mjs

  test:
    name: Tests
    if: always()
    needs: [target, changes, cli, site]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks for affected applications
        env:
          TARGET: ${{ needs.target.result }}
          CHANGES: ${{ needs.changes.result }}
          CLI: ${{ needs.cli.result }}
          SITE: ${{ needs.site.result }}
        run: |
          test "$TARGET" = success || test "$TARGET" = skipped
          test "$CHANGES" = success
          test "$CLI" = success || test "$CLI" = skipped
          test "$SITE" = success || test "$SITE" = skipped
