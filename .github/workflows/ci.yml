name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-matrix:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # Pin Windows to the VS 2022 toolchain recognized by node-gyp.
        os: [ubuntu-latest, windows-2022]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate package metadata
        run: node -e "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')); console.log('package.json is valid JSON')"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # better-sqlite3 (docs search, PR #134) needs Node >= 22 for FTS5
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

  test:
    name: Tests
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test matrix job to pass
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: test "$MATRIX_RESULT" = success
